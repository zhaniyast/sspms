# Каждые 10 минут открывает /readyz, чтобы сервис и база не «засыпали» перед демо (ответ на риск R2).
# Нужна переменная репозитория SITE_URL (Settings -> Secrets and variables -> Actions -> Variables),
# например https://sspms-portal.onrender.com
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the portal
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then echo "SITE_URL is not set"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 "${{ vars.SITE_URL }}/readyz")
          echo "readyz: $code"
          case "$code" in 200*) exit 0;; *) exit 1;; esac
